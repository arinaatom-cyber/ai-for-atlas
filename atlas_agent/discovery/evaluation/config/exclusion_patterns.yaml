# Exclusion engine rules — add patterns here without code changes.
# Fields:
#   pattern: regex (required)
#   reason: ExclusionReason enum value
#   detail: human-readable trace string
#   scope: title | full (default full = title + abstract)
#   unless_pattern: skip if this regex matches the blob
#   require_absent: skip unless this regex is absent from blob

patterns:
  # Title-only murine/avian — do not let "recombinant human …" cancel the rule
  - pattern: '\b(mouse|mice|murine|rat\b|xenograft|gallus|chicken)\b'
    reason: non_human
    detail: non-human organism in title
    scope: title

  - pattern: '\b(murine model|in mice|mouse model|nude mice|xenografted in)\b'
    reason: non_human
    detail: animal experimental system — atlas is Homo sapiens only

  - pattern: '\b(review|perspective|editorial|protocol\s+paper|narrative\s+review|benchmark|tutorial|guide\s+to|methods?\s+paper|software|toolbox|platform|integrator|workflow|explorer|scanner|a tool to|applications of artificial intelligence)\b'
    reason: methodology_review
    detail: review / methods / software title
    scope: title
    unless_pattern: '\b(\d+\s+patients?|clinical\s+cohort|multicenter)\b'

  - pattern: '\b(single-cell|scproteomics|microfluidic\s+platform)\b'
    reason: single_cell
    detail: single-cell / platform without patient cohort
    scope: title
    unless_pattern: '\b(cohort|patients?)\b'

  - pattern: '\b(phosphoproteom\w*|phospho[- ]?proteom\w*|phosphorylome|phosphosite\w*|phosphorylation[- ]?profil\w*|phospho[- ]?peptide|kinase[- ]?substrate|tiO2\s+enrichment|tio2\s+enrichment)\b'
    reason: phospho_only
    detail: phospho-only emphasis in text
    unless_pattern: '\b(proteome|protein[- ]level|global\s+proteom)\b'

  - pattern: '\b(peptide[- ]?level|peptidome|neuropeptidom|peptide\s+quantif|peptide\s+profil|peptide\s+centric|peptide\s+atlas)\b'
    reason: peptide_only
    detail: peptide-level without protein groups
    unless_pattern: '\b(global\s+proteome|protein[- ]?level|protein\s+group)\b'

  - pattern: '\btmt\s*[- ]?[2-6]\b|\btmt[2-6]\b|\b(?:2|6)-plex\b'
    reason: tmt6_or_low_plex
    detail: TMT6 / <=6-plex (need >6 channels)

  - pattern: '\b(building consensus|spectral cluster|consensus spectra|search-assisted)\b'
    reason: methodology_review
    detail: TMT methods / spectral clustering pipeline
    scope: title

  - pattern: '\b(plasma|serum|urine|saliva|cerebrospinal\s+fluid|\bpbmc\b|whole\s+blood)\b'
    reason: biofluid
    detail: biofluid only — atlas needs tissue or cell line
    unless_pattern: '\b(tissue|ffpe|biopsy|cell\s+line|resected|surgical\s+specimen)\b'

  # Human Cancer-Associated Atlas: drop non-oncology disease cohorts
  - pattern: '\b(rhegmatogenous|vitreoretinopath\w*|vitreous proteome|glaucoma\w*|trabecular meshwork|hydrocephalus|hypertrophic cardiomyopathy|phospholamban|srd5a3|hypoglycosylation|systemic lupus|chicken ovarian|kidney injury|cardiac biomarker|heart failure)\b'
    reason: off_atlas_disease
    detail: non-cancer / off-atlas disease cohort
    unless_pattern: '\b(cancer|carcinoma|tumor|tumour|glioma|melanoma|leukemia|lymphoma)\b'

  - pattern: '\b(co[- ]?immunoprecipit\w*|interactome|pull[- ]?down\s+proteom|affinity[- ]?purification|\bip[- ]?ms\b)\b'
    reason: methodology_review
    detail: Co-IP / interactome enrichment — need global proteome
    unless_pattern: '\b(global\s+proteome|protein[- ]?level|protein\s+group|proteome\s+analysis)\b'

  - pattern: '\b(microbiome|microbiota|klebsiella|bacterial proteome|pathogen proteome|gut\s+microbiome)\b'
    reason: off_atlas_disease
    detail: microbiome / pathogen focus — need human tumor tissue proteomics
    unless_pattern: '\b(tumor tissue|ffpe|biopsy|patient tissue|human tissue proteom|colorectal|carcinoma)\b'

  - pattern: '\b(type\s*[12]\s*diabetes|diabetes\s+mellitus|diabetic\s+nephropathy|diabetic\s+kidney|diabetic\s+kidney\s+disease)\b'
    reason: off_atlas_disease
    detail: diabetes — not cancer-associated proteome atlas
    unless_pattern: '\b(cancer|carcinoma|tumor|tumour|oncolog|glioma|melanoma|leukemia|lymphoma)\b'

  - pattern: '\b(sepsis|septic\s+shock|bacteremia|septicemia)\b'
    reason: off_atlas_disease
    detail: sepsis / critical infection — not cancer atlas cohort
    unless_pattern: '\b(cancer|carcinoma|tumor|tumour|oncolog)\b'

  - pattern: '\b(monkeypox|mpox|\bmpx\b|hiv\s+infection|\baids\b)\b'
    reason: off_atlas_disease
    detail: infectious disease — not cancer proteome atlas
    unless_pattern: '\b(cancer|carcinoma|tumor|tumour|oncolog|kaposi|lymphoma)\b'

  - pattern: '\b(hemodialysis|dialysis\s+patients?|chronic\s+kidney\s+disease|\bckd\b)\b'
    reason: off_atlas_disease
    detail: dialysis / CKD cohort — not tumor tissue atlas
    unless_pattern: '\b(cancer|carcinoma|tumor|tumour|oncolog|renal\s+cell|rcc|glioma)\b'
