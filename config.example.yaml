# Скопируйте в config.yaml и поправьте пути.

sheet:
  source: auto
  google_sheet_id: "1M6hc3vmk1bNchMvEwXsIyyO5iq3mAzP877HTXzhzg38"
  projects_sheet: "TMT ATLAS"
  general_sheet_name: "General single and bulk v2"
  catalog_runtime: csv
  projects_csv: "./data/projects.csv"
  proteomics_workbook: "./project of Proteomics.xlsx"

paths:
  tmt_projects_dir: "../tmt-projects/Projects"
  atlas_data_dir: "../лаб иеб/human-proteome-atlas/data"
  reports_dir: "./reports"

github:
  atlas_repo: "https://github.com/arinaatom-cyber/TMT"
  data_repo: "https://github.com/arinaatom-cyber/tmt-projects"
  raw_branch: "main"

scan:
  pride_max_results: 40
  pride_keywords: ["TMT", "tandem mass tag", "isobaric"]

# Discovery Agent — weekly search (projects.csv read-only)
discovery:
  enabled: true
  year_from: 2024
  year_to: 2026
  abstract_llm: true
  abstract_llm_max: 25   # first N pubs by relevance; rest = regex fallback
  catalog_read_only: true

agent:
  language: "ru"

# ИИ — ключи в .env (не коммитить!)
llm:
  enabled: true
  provider: "auto"          # auto | zai | qwen | claude | grok | ollama | gpt4all
  prefer_cloud: true
  model: "glm-4-flash"
  base_url: "https://api.z.ai/api/paas/v4"
  gpt4all_model: "qwen2-1_5b-instruct-q4_0.gguf"
  max_tokens: 2048

claude:
  enabled: true
  model: "claude-sonnet-4-6"
  max_tokens: 4096
